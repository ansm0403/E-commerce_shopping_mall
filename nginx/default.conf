# [최종본] api.ansmoon.dev — 80(ACME + https 리다이렉트) / 443(TLS 종단 + 리버스 프록시)
# 인증서 발급(런북 §8) 이후에만 쓸 수 있다 — 발급 전에 이 파일을 넣으면 nginx 가 시작 자체를 못 한다
# (ssl_certificate 경로 부재). 그래서 부트스트랩(default.bootstrap.conf) → 발급 → 이 파일 순서가 고정이다.
#
# 반영 방법(EC2): cp nginx/default.conf nginx/conf.d/default.conf
#               docker compose -f docker-compose.prod.yaml exec nginx nginx -t
#               docker compose -f docker-compose.prod.yaml exec nginx nginx -s reload

upstream backend_api {
    server backend:4000;
}

# 밀리초 액세스 로그(2026-09-29) — 결제 verify 와 PortOne 웹훅의 도착 순서를 재기 위해 추가.
# 기본 combined 포맷은 초 단위라 같은 초에 온 두 요청의 선후를 알 수 없다.
#   $msec         = 로그를 쓰는 시각(응답 완료, epoch 초.밀리초)
#   $request_time = 요청 첫 바이트 수신 ~ 응답 완료(초.밀리초)  →  도착 ≈ $msec - $request_time
#   $upstream_response_time = 백엔드가 쓴 시간
# conf.d/*.conf 는 http 컨텍스트에 include 되므로 log_format 은 server 밖(여기)에 둔다.
# 기록 위치는 그대로 /var/log/nginx/access.log(→ /dev/stdout) — `docker compose logs nginx` 로 읽는다.
log_format timed '$remote_addr - $remote_user [$time_iso8601] msec=$msec "$request" $status $body_bytes_sent '
                 'rt=$request_time urt=$upstream_response_time "$http_referer" "$http_user_agent"';

# ── 80: 인증서 갱신 통로 + 나머지는 전부 https 로 ──────────────────────────────
server {
    listen 80;
    server_name api.ansmoon.dev;

    # certbot 갱신(HTTP-01)은 평문 80 으로 와야 하므로 이 경로만 리다이렉트에서 제외
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 443: TLS 종단 → backend ────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name api.ansmoon.dev;

    # 결정 13: ./certbot/conf 를 /etc/letsencrypt 에 "디렉터리 통째"로 마운트해야
    # live/ 안의 심링크(→ ../../archive/...)가 살아 있다.
    ssl_certificate     /etc/letsencrypt/live/api.ansmoon.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ansmoon.dev/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10m;           # 상품 이미지 업로드 (기본 1m → 413)
    access_log /var/log/nginx/access.log timed;   # 위 log_format timed (밀리초)

    # PortOne V2 웹훅 — 발신 IP 제한(네트워크 층). 앱 층의 서명 검증(PORTONE_WEBHOOK_SECRET)과 한 세트.
    # PortOne 이 공지한 V2 웹훅 발신 IP 는 52.78.5.241 하나다(변경 시 사전 공지 — 바뀌면 여기만 고친다).
    # `=` 정확 일치라 /v1/payments/webhook 만 해당하고 verify·cancel 은 아래 location / 를 탄다.
    # proxy_set_header 는 location 간 상속이 없어 아래 블록과 똑같이 다시 적는다.
    location = /v1/payments/webhook {
        allow 52.78.5.241;
        deny  all;                      # 나머지는 403 — 백엔드까지 가지 않는다

        proxy_pass http://backend_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://backend_api;  # 슬래시 없음 = URI 무변경 (/v1, /uploads 둘 다 통과)

        # 백엔드(TRUST_PROXY_HOPS=1)가 원 요청 정보를 복원하는 3종 세트
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE(POST /v1/admin/assistant/stream) — 백엔드가 X-Accel-Buffering: no 를 보내므로
        # proxy_buffering off 는 불필요, 긴 read timeout 만 필요 (결정 5 수정판)
        proxy_read_timeout 300s;
    }
}
