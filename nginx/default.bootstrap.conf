# [부트스트랩용] 80 포트만 — 인증서가 아직 없는 단계에서 쓰는 설정 (런북 §6)
# 역할: ① certbot HTTP-01 검증 경로 제공  ② IP 로 "nginx→backend" 경로를 검증
# 인증서 발급 후에는 default.conf(최종본)로 교체하고 reload 한다 (런북 §8).
# 로컬 연습(docker-compose.nginx-practice.yaml)도 이 파일을 쓴다.

# upstream 별명: compose 서비스명 backend 의 4000.
# ⚠ nginx 는 시작 시 backend → IP 를 1회만 해석해 캐시한다.
#    backend 재생성으로 IP 가 바뀌면 `nginx -s reload` 전까지 502 (결정 8, 로컬 실험 3에서 재현).
upstream backend_api {
    server backend:4000;
}

server {
    listen 80;
    server_name _;                      # 부트스트랩 단계는 IP 직접 접근이라 아무 Host 나 받는다

    client_max_body_size 10m;           # 상품 이미지 업로드 (기본 1m → 413)

    # certbot webroot 검증 경로 — LE 서버가 http://api.ansmoon.dev/.well-known/acme-challenge/<token> 을 방문
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://backend_api;  # 경로 뒤 슬래시 없음 = URI 무변경 (/v1, /uploads 둘 다 통과)

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;        # SSE(LLM 스트리밍) 첫 토큰 대기 — 기본 60s 면 끊긴다
    }
}
