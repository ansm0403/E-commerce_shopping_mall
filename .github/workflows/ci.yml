name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Actions 탭에서 "Run workflow" 버튼으로 수동 실행 (알림 테스트용)

permissions:
  actions: read
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test_db
      TEST_POSTGRES_DB: test_db
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Nx affected base/head SHAs
        uses: nrwl/nx-set-shas@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Get yarn cache directory
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint affected projects
        run: yarn nx affected -t lint --base=$NX_BASE --head=$NX_HEAD

      - name: Test affected projects
        run: yarn nx affected -t test --base=$NX_BASE --head=$NX_HEAD

      - name: Build affected projects
        run: yarn nx affected -t build --base=$NX_BASE --head=$NX_HEAD

      # CI 결과(성공/실패)를 Slack #deployments 채널로 알림.
      # always(): 앞 단계가 실패해도 실행 → 실패도 알림. PR에는 알림 안 보냄(노이즈 방지).
      # 비밀값은 GitHub repo Secret(SLACK_WEBHOOK_DEPLOYMENTS)에서 읽으므로 코드에 URL 없음.
      - name: Notify Slack (CI 결과)
        if: always() && github.event_name != 'pull_request'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_DEPLOYMENTS }}
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "SLACK_WEBHOOK_DEPLOYMENTS 시크릿 미설정 → 알림 스킵"
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then
            EMOJI="✅"; STATUS="성공"
          else
            EMOJI="❌"; STATUS="실패"
          fi
          COMMIT_FIRST=$(printf '%s' "$COMMIT_MSG" | head -n1)
          TEXT=$(printf '%s *CI %s* — `%s`\n• 브랜치: `%s` (by %s)\n• 커밋: %s\n• <%s|GitHub Actions 로그 보기>' \
            "$EMOJI" "$STATUS" "$REPO" "$BRANCH" "$ACTOR" "${COMMIT_FIRST:-수동 실행(workflow_dispatch)}" "$RUN_URL")
          PAYLOAD=$(jq -n --arg text "$TEXT" '{text: $text}')
          curl -s -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK"
